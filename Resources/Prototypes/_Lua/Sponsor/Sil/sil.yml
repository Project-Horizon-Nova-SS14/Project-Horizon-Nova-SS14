# Hypospray
- type: entity
  id: HypospraySil
  name: гипоспрей "HEALTH-13"
  parent: BaseItem
  description: Стрелка каплевидного резервуара окружена кольцом полупрозрачных мембран, при взмахе через стенки проскакивают мягкие волны перламутрового света.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lua/Sponsor/Sil/hypo.rsi
    state: icon
  - type: Item
    sprite: _Lua/Sponsor/Sil/hypo.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 5
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Injector
    solutionName: hypospray
    activeModeProtoId: HyposprayDynamicMode
    allowedModes:
    - HyposprayDynamicMode
    - HyposprayInjectMode
  - type: UseDelay
    delay: 0.5
