# The universal RnD storage drive of the data center. A new drive is blank and takes the discipline of the slot it is
# put in; it keeps the technologies researched while it is there, and breaks after a day of work, losing them.
- type: entity
  parent: BaseItem
  id: HorizonRndDisk
  name: RnD storage drive
  description: A universal storage drive for the RnD data center. It takes the discipline of the slot it is put in.
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_pickup.ogg
      params:
        volume: -6
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  - type: Sprite
    sprite: _Horizon/Objects/Specific/Research/rnd_disk.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 150
  - type: RndDisk
