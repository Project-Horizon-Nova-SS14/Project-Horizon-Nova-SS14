# Спрайты: Goob-Station (_Floofstation/Mobs/Species/Resomi, _Goobstation/Mobs/Customization/Resomi).
# Механики способностей: идея ss14-wega (Sunrise), адаптирована под Lua.
#
# Профиль резоми:
#  - метаболизм 1.0 ед/тик (животный желудок), голод/жажда на 30% быстрее;
#  - объём крови -25%, +15% любого урона, кроме обморожения;
#  - шёпот в радиусе 4 тайлов, вспышки в 2 раза дольше;
#  - хит-бокс меньше на 17%, труднее таскают других, их — легче;
#  - ходьба 2.91 / бег 4.6, безоружный удар 5 режущего;
#  - +30% разброса из двуручного огнестрела (кроме лазерного);
#  - безопасная температура от 205K до 305K;
#  - accent, «Спринт» и «Четырёхканальный слух».

- type: entity
  save: false
  name: Urist McResomi
  parent: BaseMobSpeciesOrganic
  id: MobResomiBase
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Resomi
    hideLayersOnEquip:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: Hunger
    baseDecayRate: 0.026 # 0.02 x 1.3
  - type: Thirst
    baseDecayRate: 0.13 # 0.1 x 1.3
  - type: Bloodstream
    bloodMaxVolume: 225 # -25% от 300
  - type: Temperature
    currentTemperature: 300.15
    coldDamageThreshold: 205
    heatDamageThreshold: 305
    coldDamage:
      types:
        Cold : 0.05
    heatDamage:
      types:
        Heat : 0.2
  - type: TemperatureSpeed
    thresholds:
      260: 0.9
      230: 0.8
      205: 0.7
  - type: ThermalRegulator
    normalBodyTemperature: 300.15
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.91
    baseRunningSpeed: 4.6
    baseSprintSpeed: 4.6 # отдельный бег не нужен, ускорение даёт способка «Спринт»
  - type: LuaSprint # расходом и восстановлением владеет ResomiSprintSystem
    maxSprint: 100
    drainPerSecond: 0.0
    regenPerSecond: 0.0
    regenDelay: 0.30
    recoverThresholdFraction: 0.30
  - type: ResomiSprint
  - type: ResomiHearingSkill
  - type: ResomiAccent
  - type: ChatModifier
    whisperListeningRange: 4
  - type: FlashModifier
    modifier: 2
  - type: TwoHandedSpreadPenalty
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Resomi
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    attackRate: 1
    damage:
      types:
        Slash: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.29 # 0.35 - 17%
        density: 160
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Carriable
  - type: CantCarryOthers
  - type: PseudoItem
    storedOffset: 0,17
    shape:
      - 0,0,1,4
      - 0,2,3,4
      - 4,0,5,4
  - type: Icon
    sprite: _HorizonNova/Mobs/Species/Resomi/parts.rsi
    state: full
  - type: Body
    prototype: Resomi
    requiredLegs: 2
  - type: Speech
    speechSounds: Avali
    allowedEmotes: ['Chirp', 'Growl']
  - type: Vocal
    sounds:
      Male: MaleAvali
      Female: FemaleAvali
      Unsexed: MaleAvali
  - type: LanguageKnowledge # Lua
    speaks:
    - Intergalactic
    understands:
    - Intergalactic
  - type: Inventory
    speciesId: resomi
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _HorizonNova/Mobs/Species/Resomi/displacement.rsi
