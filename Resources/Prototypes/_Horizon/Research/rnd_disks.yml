# Disks of the RnD array, one kind per discipline. A new disk is empty; it keeps the technologies researched while it
# is in the slot of its discipline, and breaks after a day of work, losing them.
- type: entity
  abstract: true
  parent: BaseItem
  id: HorizonRndDiskBase
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_pickup.ogg
      params:
        volume: -6
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  - type: Sprite
    sprite: _Horizon/Objects/Specific/Research/rnd_disk.rsi
    layers:
    - state: icon
    - state: stripes
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 150

- type: entity
  parent: HorizonRndDiskBase
  id: HorizonRndDiskEngineering
  name: RnD array disk (engineering)
  description: A disk for the engineering slot of the RnD array.
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: stripes
      color: "#f0d060"
  - type: RndDisk
    discipline: NFEngineering

