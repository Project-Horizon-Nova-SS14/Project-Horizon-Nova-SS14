# RnD storage drives of the data center, one kind per discipline; they look the same and the description names the
# discipline. A new drive is empty; it keeps the technologies researched while it is in the slot of its discipline,
# and breaks after a day of work, losing them.
- type: entity
  abstract: true
  parent: BaseItem
  id: HorizonRndDiskBase
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_pickup.ogg
      params:
        volume: -6
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  - type: Sprite
    sprite: _Horizon/Objects/Specific/Research/rnd_disk.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 150

- type: entity
  parent: HorizonRndDiskBase
  id: HorizonRndDiskEngineering
  name: RnD storage drive
  description: "An empty storage drive for the RnD data center. Discipline: engineering."
  components:
  - type: RndDisk
    discipline: NFEngineering

- type: entity
  parent: HorizonRndDiskBase
  id: HorizonRndDiskMedical
  name: RnD storage drive
  description: "An empty storage drive for the RnD data center. Discipline: medical."
  components:
  - type: RndDisk
    discipline: NFMedical

- type: entity
  parent: HorizonRndDiskBase
  id: HorizonRndDiskSalvage
  name: RnD storage drive
  description: "An empty storage drive for the RnD data center. Discipline: salvage."
  components:
  - type: RndDisk
    discipline: NFSalvage

- type: entity
  parent: HorizonRndDiskBase
  id: HorizonRndDiskScience
  name: RnD storage drive
  description: "An empty storage drive for the RnD data center. Discipline: science."
  components:
  - type: RndDisk
    discipline: NFScience

- type: entity
  parent: HorizonRndDiskBase
  id: HorizonRndDiskService
  name: RnD storage drive
  description: "An empty storage drive for the RnD data center. Discipline: service."
  components:
  - type: RndDisk
    discipline: NFService

- type: entity
  parent: HorizonRndDiskBase
  id: HorizonRndDiskShiparmory
  name: RnD storage drive
  description: "An empty storage drive for the RnD data center. Discipline: ship armory."
  components:
  - type: RndDisk
    discipline: Shiparmory
