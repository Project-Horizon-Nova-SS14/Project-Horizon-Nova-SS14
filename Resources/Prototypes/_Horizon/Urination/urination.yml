# Alerts
- type: alertCategory
  id: Urination

- type: alert
  id: UrinationUrge
  category: Urination
  icons:
  - sprite: /Textures/_Horizon/Interface/Alerts/defecation.rsi
    state: urge
  name: alerts-urination-urge-name
  description: alerts-urination-urge-desc

- type: alert
  id: UrinationCritical
  category: Urination
  icons:
  - sprite: /Textures/_Horizon/Interface/Alerts/defecation.rsi
    state: critical
  name: alerts-urination-critical-name
  description: alerts-urination-critical-desc

# Action
- type: entity
  id: ActionUrinate
  name: Urinate
  description: Relieve yourself.
  components:
  - type: Action
    icon:
      sprite: /Textures/_Horizon/Interface/Actions/defecation.rsi
      state: icon
    useDelay: 10
  - type: InstantAction
    event: !type:UrinateActionEvent

# Reagents
- type: reagent
  id: Urine
  name: reagent-name-urine
  desc: reagent-desc-urine
  physicalDesc: reagent-physical-desc-cloudy
  color: "#e5d24c"
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 2

# Единая жидкость туалета: и дефекация, и мочеиспускание попадают сюда одним реагентом.
- type: reagent
  id: Sewage
  name: reagent-name-sewage
  group: Toxins
  desc: reagent-desc-sewage
  physicalDesc: reagent-physical-desc-putrid
  color: "#4a3b24"
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 6
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1
