# Порт с Goob-Station: Resources/Prototypes/_Floofstation/Body/Parts/resomi.yml,
# адаптировано под структуру частей тела этой сборки (как у Авали).

- type: entity
  id: PartResomi
  parent: BaseItem
  name: туловище
  abstract: true
  components:
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
    species: Resomi
  - type: SurgeryTool # Shitmed Change
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/organ1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/organ2.ogg
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice #DynamicPrice
    price: 100
  - type: Tag
    tags:
      - Trash

- type: entity
  id: TorsoResomi
  name: торс
  parent: PartResomi
  components:
  - type: Sprite
    netsync: false
    sprite: _HorizonNova/Mobs/Species/Resomi/parts.rsi
    state: "chest_m"
  - type: Icon
    sprite: _HorizonNova/Mobs/Species/Resomi/parts.rsi
    state: "chest_m"
  - type: BodyPart
    partType: Torso

- type: entity
  id: HeadResomi
  name: голова
  parent: PartResomi
  components:
  - type: Sprite
    netsync: false
    sprite: _HorizonNova/Mobs/Species/Resomi/parts.rsi
    state: "head_m"
  - type: Icon
    sprite: _HorizonNova/Mobs/Species/Resomi/parts.rsi
    state: "head_m"
  - type: BodyPart
    partType: Head
    vital: true
  - type: Input
    context: "ghost"
  - type: InputMover
  - type: GhostOnMove
  - type: Tag
    tags:
      - Head

