# The RnD relay links access points to the RnD data center, wirelessly and wherever they are. There are five levels,
# each a machine of its own with its own board; a higher level has more channels. Upgrading means rebuilding the
# machine with the board of the next level.
- type: entity
  abstract: true
  id: HorizonRndRelayBase
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  components:
  - type: Sprite
    sprite: Structures/Machines/telecomms.rsi
    snapCardinals: true
    layers:
    - state: telecom-nopower
    - state: telecom-stripe
    - state: telecom-on
      shader: unshaded
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: variant-science
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ActivatableUI
    key: enum.RndRelayUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.RndRelayUiKey.Key:
        type: RndRelayBoundUserInterface
  - type: ApcPowerReceiver
    powerLoad: 500

- type: entity
  id: HorizonRndRelay
  parent: HorizonRndRelayBase
  name: RnD relay (level 1)
  description: Links RnD access points to the RnD data center. Every access point takes one of its 5 channels.
  components:
  - type: Machine
    board: HorizonRndRelayMachineCircuitboard
  - type: RndRelay
    level: 1
    capacity: 5
  - type: ApcPowerReceiver
    powerLoad: 500

- type: entity
  id: HorizonRndRelay2
  parent: HorizonRndRelayBase
  name: RnD relay (level 2)
  description: Links RnD access points to the RnD data center. Every access point takes one of its 8 channels.
  components:
  - type: Machine
    board: HorizonRndRelay2MachineCircuitboard
  - type: RndRelay
    level: 2
    capacity: 8
  - type: ApcPowerReceiver
    powerLoad: 600

- type: entity
  id: HorizonRndRelay3
  parent: HorizonRndRelayBase
  name: RnD relay (level 3)
  description: Links RnD access points to the RnD data center. Every access point takes one of its 12 channels.
  components:
  - type: Machine
    board: HorizonRndRelay3MachineCircuitboard
  - type: RndRelay
    level: 3
    capacity: 12
  - type: ApcPowerReceiver
    powerLoad: 700

- type: entity
  id: HorizonRndRelay4
  parent: HorizonRndRelayBase
  name: RnD relay (level 4)
  description: Links RnD access points to the RnD data center. Every access point takes one of its 16 channels.
  components:
  - type: Machine
    board: HorizonRndRelay4MachineCircuitboard
  - type: RndRelay
    level: 4
    capacity: 16
  - type: ApcPowerReceiver
    powerLoad: 800

- type: entity
  id: HorizonRndRelay5
  parent: HorizonRndRelayBase
  name: RnD relay (level 5)
  description: Links RnD access points to the RnD data center. Every access point takes one of its 20 channels.
  components:
  - type: Machine
    board: HorizonRndRelay5MachineCircuitboard
  - type: RndRelay
    level: 5
    capacity: 20
  - type: ApcPowerReceiver
    powerLoad: 1000

# The RnD access point gives the research machines of its grid the technologies of the RnD data center once it is linked to
# a relay.
- type: entity
  id: HorizonRndAccessPoint
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: RnD access point
  description: Gives the research machines of the ship the technologies of the RnD data center. Link it to an RnD relay.
  components:
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    snapCardinals: true
    layers:
    - state: server-off
    - state: server-on
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: variant-crew
    - state: server_o
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: WiresVisuals
  - type: Machine
    board: HorizonRndAccessPointMachineCircuitboard
  - type: RndAccessPoint
  - type: ActivatableUI
    key: enum.RndAccessPointUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.RndAccessPointUiKey.Key:
        type: RndAccessPointBoundUserInterface
  - type: ApcPowerReceiver
    powerLoad: 200

- type: entity
  id: HorizonRndRelayMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: RnD relay machine board (level 1)
  description: A machine printed circuit board for a level 1 RnD relay.
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: HorizonRndRelay
    requirements:
      Capacitor: 2
      Manipulator: 1
    stackRequirements:
      Steel: 5
      Glass: 2
      Cable: 5

