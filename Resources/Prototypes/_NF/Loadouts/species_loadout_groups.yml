- type: loadoutGroup
  id: NFSpeciesSpecific # prefixed just for visual ID
  name: loadout-group-breath-tool # if visible, rename
  minLimit: 3
  maxLimit: 3
  hidden: true
  loadouts:
  - LoadoutTankHarness
  - LoadoutSpeciesBreathTool
  - LoadoutSpeciesVoxNitrogen
  fallbacks:
  - LoadoutTankHarness
  - LoadoutSpeciesBreathTool
  - LoadoutSpeciesVoxNitrogen

- type: loadoutGroup
  id: NfsdSpeciesSpecific
  name: loadout-group-breath-tool # if visible, rename
  minLimit: 3
  maxLimit: 3
  hidden: true
  loadouts:
  - LoadoutTankHarness
  # - NfsdVoxClothingMaskGasNfsd #HN: лодаут отсутствует (профессия удалена)
  - LoadoutSpeciesVoxNitrogen
  fallbacks:
  - LoadoutTankHarness
  # - NfsdVoxClothingMaskGasNfsd #HN: лодаут отсутствует (профессия удалена)
  - LoadoutSpeciesVoxNitrogen

# Forced EVA
#HN: группы *ForcedOuterClothing удалённых на этой ветке профессий (Nfsd, Pirate,
# Prisoner, Sr, Stc, Doc, SecurityGuard, Janitor, Valet, MailCarrier, Mercenary)
# убраны целиком: их LoadoutPrototype (*ForcedClothingOuterEVASuit*, NfsdVox...)
# в сборке отсутствуют, а пустые loadouts/fallbacks не читаются (null недопустим).
# При возврате профессий вернуть и группы (есть в апстриме _NF).
- type: loadoutGroup
  id: ContractorForcedOuterClothing
  name: loadout-group-contractor-outerclothing
  minLimit: 1
  maxLimit: 1
  hidden: true
  loadouts:
  - ContractorForcedClothingOuterEVASuitContractor
  fallbacks:
  - ContractorForcedClothingOuterEVASuitContractor

- type: loadoutGroup
  id: PilotForcedOuterClothing
  name: loadout-group-contractor-outerclothing
  minLimit: 1
  maxLimit: 1
  hidden: true
  loadouts:
  - PilotForcedClothingOuterEVASuitPilot
  fallbacks:
  - PilotForcedClothingOuterEVASuitPilot
