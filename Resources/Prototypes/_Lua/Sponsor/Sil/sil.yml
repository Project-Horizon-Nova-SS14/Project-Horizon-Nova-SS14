# Hardsuit
- type: sponsorLoadout
  id: Sil
  ownerLogin: _Sil
  tier: god
  entities:
    - ClothingBackpackSil
    - HypospraySil
    - ClothingBeltSilFilled
    - ClothingMaskGasSil
    - ClothingShoesBootsSil
    - PDASil
    - AirTankSil
    - ClothingUniformJumpsuitSil
    - ClothingNeckSil
    - ClothingHandsGlovesSil
    - ClothingEyesHudSil
    - ViolinInstrument

- type: entity
  parent: [ClothingOuterHardsuitAtmos, HardsuitSpeedBuff]
  id: ClothingOuterHardsuitSil
  name: скафандр "СЕВА"
  description: Принадлежат члену экипажа, находящемуся под покровительством спонсорской организации.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Lua/Sponsor/Sil/hardsuit.rsi
  - type: Clothing
    sprite: _Lua/Sponsor/Sil/hardsuit.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitSil
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        whitelist:
          tags:
            - PowerCell
  - type: Item
    size: Huge
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.6
        Heat: 0.7
        Radiation: 0.5
        Caustic: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

- type: entity
  parent: ClothingHeadHelmetHardsuitAtmos
  id: ClothingHeadHelmetHardsuitSil
  categories: [ HideSpawnMenu ]
  name: шлем скафандра "СЕВА"
  description: Шлем изолирующий владельца от страшного вакуума снаружи.
  components:
  - type: Sprite
    sprite: _Lua/Sponsor/Sil/helmet.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: Clothing
    sprite: _Lua/Sponsor/Sil/helmet.rsi
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
  - type: ToggleableLightVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET-unshaded
        shader: unshaded
      - state: equipped-head-light
        shader: unshaded
  - type: PointLight
    color: "#4eb1ae"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

