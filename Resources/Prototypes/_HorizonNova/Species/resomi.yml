- type: species
  id: Resomi
  name: species-name-resomi
  roundStart: true
  prototype: MobResomi
  sprites: MobResomiSprites
  defaultSkinTone: "#faf7f7"
  markingLimits: MobResomiMarkingLimits
  dollPrototype: MobResomiDummy
  skinColoration: Hues
  maleFirstNames: NamesResomiMale
  femaleFirstNames: NamesResomiFemale
  naming: First

- type: speciesBaseSprites
  id: MobResomiSprites
  sprites:
    Head: MobResomiHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: MobResomiChest
    Eyes: MobResomiEyes
    LArm: MobResomiLArm
    RArm: MobResomiRArm
    LHand: MobResomiLHand
    RHand: MobResomiRHand
    LLeg: MobResomiLLeg
    RLeg: MobResomiRLeg
    LFoot: MobResomiLFoot
    RFoot: MobResomiRFoot
    Tail: MobHumanoidAnyMarking
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking

- type: markingPoints
  id: MobResomiMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 0
      required: false
    Snout:
      points: 1
      required: false
    Head:
      points: 3
      required: false
    HeadTop:
      points: 3
      required: false
    Chest:
      points: 3
      required: false
    Tail:
      points: 2
      required: true
      defaultMarkings: [ ResomiTail, ResomiTailFeathers ]
    Arms:
      points: 2
      required: false
    Legs:
      points: 2
      required: false

